version: '3.8'

services:
  shopmate-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopmate-ai-aegis
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/shopmate_aegis
      - JWT_SECRET=shopmate_production_jwt_secret_paypal_aegis_2026
      - HMAC_SECRET=shopmate_production_hmac_secret_fingerprint_key
      - APPROVAL_SECRET=shopmate_production_approval_secret_paypal_aegis_2026
      - PAYPAL_BASE_URL=https://api-m.sandbox.paypal.com
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7-jammy
    container_name: shopmate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local
